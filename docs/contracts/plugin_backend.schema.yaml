$schema: https://json-schema.org/draft/2020-12/schema
$id: https://ai-agent.local/schemas/plugin-backend-v1.json
title: Plugin Backend Extension V1
type: object
additionalProperties: false
required:
  - schema_version
  - entry
  - capabilities
properties:
  schema_version:
    const: "1.0"
  entry:
    type: string
    pattern: '^(?!/)(?!.*\.\.).+$'
  capabilities:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: '^[a-z][a-z0-9_.-]*$'
  permissions:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: '^[a-z][a-z0-9_.-]*$'
  dependencies:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [capability, kind]
      properties:
        capability:
          type: string
          pattern: '^[a-z][a-z0-9_.-]*$'
        kind:
          enum: [required, replaceable, optional]
